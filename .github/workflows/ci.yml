name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build production application
        run: npm run build
      - name: Run unit tests
        run: npm test -- --watch=false

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_TERM_COLOR: always
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: Check formatting
        run: cargo fmt --check
      - name: Compile application
        run: cargo build --locked
      - name: Check code quality
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Validate Compose configuration
        working-directory: .
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.dev.yml config --quiet
          docker compose -f compose.test.yml config --quiet

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate specification and response examples
        working-directory: backend
        run: npx --yes @redocly/cli@2.45.0 lint --config redocly.yaml openapi.yaml

  integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure OpenSearch kernel requirement
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run integration tests with isolated services
        run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from integration integration
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color
      - name: Clean up test services
        if: always()
        run: docker compose -f compose.test.yml down --volumes --remove-orphans
